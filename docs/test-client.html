<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO + Redis Test Client</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .status {
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
      text-align: center;
    }

    .status.disconnected {
      background: #fee;
      color: #c33;
    }

    .status.connected {
      background: #efe;
      color: #3c3;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .output {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .output:empty::before {
      content: 'Los eventos aparecerán aquí...';
      color: #999;
      font-style: italic;
    }

    .event {
      background: white;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 10px;
      border-left: 4px solid #667eea;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .event-title {
      font-weight: 600;
      color: #667eea;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .event-time {
      color: #999;
      font-size: 12px;
      margin-left: auto;
    }

    .event-data {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #444;
      line-height: 1.6;
    }

    .event-data strong {
      color: #667eea;
    }

    .error {
      border-left-color: #f44;
    }

    .error .event-title {
      color: #f44;
    }

    .success {
      border-left-color: #4c4;
    }

    .success .event-title {
      color: #4c4;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .controls button {
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔌 Socket.IO + Redis Demo</h1>
    <p class="subtitle">Cliente de prueba para eventos en tiempo real</p>

    <div id="status" class="status disconnected">
      ⚠️ Desconectado
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="itemsCreated">0</div>
        <div class="stat-label">Items Creados</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="totalItems">0</div>
        <div class="stat-label">Total en Redis</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="lastItem">-</div>
        <div class="stat-label">Último Item</div>
      </div>
    </div>

    <div class="controls">
      <button id="createBtn" disabled>Crear Item</button>
      <button id="clearBtn">Limpiar Log</button>
    </div>

    <div id="output" class="output"></div>
  </div>

  <script>
    // ============================================
    // CONFIGURACIÓN
    // ============================================
    const SERVER_URL = 'http://localhost:4000'
    
    // ============================================
    // ESTADÍSTICAS
    // ============================================
    let stats = {
      itemsCreated: 0,
      totalItems: 0,
      lastItem: '-'
    }

    function updateStats() {
      document.getElementById('itemsCreated').textContent = stats.itemsCreated
      document.getElementById('totalItems').textContent = stats.totalItems
      document.getElementById('lastItem').textContent = stats.lastItem
    }

    // ============================================
    // LOGGER DE EVENTOS
    // ============================================
    function logEvent(title, data, type = 'info') {
      const output = document.getElementById('output')
      const event = document.createElement('div')
      event.className = `event ${type}`
      
      const now = new Date().toLocaleTimeString()
      
      let dataString = ''
      if (typeof data === 'object') {
        dataString = Object.entries(data)
          .map(([key, value]) => `<strong>${key}:</strong> ${JSON.stringify(value)}`)
          .join('<br>')
      } else {
        dataString = data
      }

      event.innerHTML = `
        <div class="event-title">
          ${type === 'error' ? '❌' : type === 'success' ? '✅' : '📡'} ${title}
          <span class="event-time">${now}</span>
        </div>
        <div class="event-data">${dataString}</div>
      `
      
      output.insertBefore(event, output.firstChild)

      // Limitar a 20 eventos
      while (output.children.length > 20) {
        output.removeChild(output.lastChild)
      }
    }

    // ============================================
    // CONEXIÓN A SOCKET.IO
    // ============================================
    console.log('🔌 Conectando a:', SERVER_URL)
    const socket = io(SERVER_URL)

    // ============================================
    // EVENTO: connect
    // ============================================
    socket.on('connect', () => {
      console.log('✅ Conectado con ID:', socket.id)
      
      const statusDiv = document.getElementById('status')
      statusDiv.className = 'status connected'
      statusDiv.textContent = `✅ Conectado (${socket.id})`
      
      document.getElementById('createBtn').disabled = false
      
      logEvent('Conexión establecida', { socketId: socket.id }, 'success')
    })

    // ============================================
    // EVENTO: disconnect
    // ============================================
    socket.on('disconnect', (reason) => {
      console.log('❌ Desconectado:', reason)
      
      const statusDiv = document.getElementById('status')
      statusDiv.className = 'status disconnected'
      statusDiv.textContent = '⚠️ Desconectado'
      
      document.getElementById('createBtn').disabled = true
      
      logEvent('Desconexión', { reason }, 'error')
    })

    // ============================================
    // EVENTO: system:connected
    // ============================================
    socket.on('system:connected', (data) => {
      console.log('🎉 Sistema confirmado:', data)
      logEvent('Sistema listo', data, 'success')
    })

    // ============================================
    // EVENTO: item-created
    // ============================================
    socket.on('item-created', (data) => {
      console.log('🎉 Item creado:', data)
      
      // Actualizar estadísticas
      stats.itemsCreated++
      stats.totalItems = data.existingItemsCount + 1
      stats.lastItem = data.createdItem
      updateStats()
      
      logEvent('Item Creado', {
        item: data.createdItem,
        último: data.lastCreatedItem || 'ninguno',
        TTL: `${data.ttlSeconds}s`,
        total: data.existingItemsCount + 1
      }, 'success')
    })

    // ============================================
    // EVENTO: error
    // ============================================
    socket.on('error', (data) => {
      console.error('❌ Error:', data)
      logEvent('Error del Servidor', {
        mensaje: data.message,
        código: data.code || 'N/A'
      }, 'error')
    })

    // ============================================
    // BOTÓN: Crear Item
    // ============================================
    document.getElementById('createBtn').addEventListener('click', () => {
      console.log('📤 Emitiendo: create-item')
      
      logEvent('Solicitud enviada', { evento: 'create-item' })
      
      socket.emit('create-item', (response) => {
        console.log('📥 Respuesta del callback:', response)
        
        if (response.success) {
          logEvent('Confirmación recibida', { success: true }, 'success')
        } else {
          logEvent('Error en callback', { error: response.error }, 'error')
        }
      })
    })

    // ============================================
    // BOTÓN: Limpiar Log
    // ============================================
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('output').innerHTML = ''
      console.clear()
    })

    // ============================================
    // ATAJOS DE TECLADO
    // ============================================
    document.addEventListener('keydown', (e) => {
      // Espacio = Crear item
      if (e.code === 'Space' && !document.getElementById('createBtn').disabled) {
        e.preventDefault()
        document.getElementById('createBtn').click()
      }
      
      // C = Limpiar
      if (e.code === 'KeyC' && e.ctrlKey) {
        e.preventDefault()
        document.getElementById('clearBtn').click()
      }
    })

    console.log('💡 Tip: Presiona ESPACIO para crear items rápidamente')
  </script>
</body>
</html>
